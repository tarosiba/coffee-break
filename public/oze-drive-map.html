<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静岡市 → 尾瀬 ドライブマップ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f0e6;
      color: #333;
      padding: 24px;
      line-height: 1.6;
    }
    h1 { text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
    p.note { text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem; }
    .map-wrap {
      max-width: 1100px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 16px;
    }
    .map-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .legend {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .legend h2 { font-size: 1.1rem; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { border-bottom: 1px solid #eee; padding: 8px 12px; text-align: left; }
    th { background: #faf7f2; width: 28%; }
  </style>
</head>
<body>
  <h1>静岡市 → 尾瀬 ドライブマップ</h1>
  <p class="note">片道 約4〜5時間 ｜ マイカー規制区間はシャトルバス利用</p>

  <div class="map-wrap">
    <img src="./shizuoka-to-oze-illustrated-map.png" alt="静岡市から尾瀬までのイラストマップ">
  </div>

  <div class="legend">
    <h2>立ち寄りスポット一覧</h2>
    <table>
      <tr><th>① 足柄SA</th><td>東名途中。富士山ビューの休憩</td></tr>
      <tr><th>道の駅 すばしり</th><td>富士に近い道の駅・足湯（遠回り寄り道）</td></tr>
      <tr><th>沼田IC</th><td>高速終点。ここから一般道（高速約3時間15分）</td></tr>
      <tr><th>② 吹割の滝</th><td>120号沿いの定番寄り道</td></tr>
      <tr><th>③ 尾瀬かたしな</th><td>まいたけうどん・尾瀬直前の休憩</td></tr>
      <tr><th>④ 尾瀬戸倉 駐車場</th><td>ここで車を停める（1,000円/日）</td></tr>
      <tr><th>シャトルバス</th><td>鳩待峠まで25〜35分（片道約1,300円）</td></tr>
      <tr><th>⑤ 鳩待峠</th><td>登山口</td></tr>
      <tr><th>⑥ 尾瀬ヶ原</th><td>ゴール。木道と湿原</td></tr>
      <tr><th>帰路</th><td>八ッ場ダム → 伊香保温泉 → 浜名湖SA → 静岡</td></tr>
    </table>
  </div>
</body>
</html>
